name: Create daily editorial draft

on:
  schedule:
    # GitHub Actions dùng UTC. 00:00 UTC = 07:00 giờ Việt Nam (UTC+7).
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Chỉ kiểm tra nguồn, không tạo bản nháp'
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: daily-editorial-draft
  cancel-in-progress: false

jobs:
  create-draft:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: https://yxzoeicxoppupxxilzjh.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Verify runtime
        run: node --version
      - name: Create one review-only daily draft
        run: node scripts/create-daily-editorial-draft.mjs
